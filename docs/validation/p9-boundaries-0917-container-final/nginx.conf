# Zones are shared across Nginx workers. Client supplied forwarding headers are
# deliberately ignored; this deployment exposes Nginx directly on the host.
limit_req_zone $binary_remote_addr zone=api_requests:10m rate=20r/s;
map $uri $auth_limit_key {
    default "";
    ~^/api/v1/auth/(login|register)/?$ $binary_remote_addr;
}
map $uri $model_limit_key {
    default "";
    ~^/api/v1/agent/runs/[^/]+/advance/?$ $binary_remote_addr;
    ~^/api/v1/receipts/[^/]+/parse/?$ $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth_requests:10m rate=5r/m;
limit_req_zone $model_limit_key zone=model_requests:10m rate=30r/m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests; retry later"}}';
    }
    location /api/ {
        limit_req zone=api_requests burst=80 nodelay;
        limit_req zone=auth_requests burst=10 nodelay;
        limit_req zone=model_requests burst=16 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 180s;
        add_header Cache-Control "no-store" always;
    }
    location /health/ {
        proxy_pass http://api:8000;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server { listen 8000; default_type application/json; return 200 "{}"; }
