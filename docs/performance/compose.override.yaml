services:
  db:
    environment:
      MYSQL_DATABASE: solomeal_perf_m1
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u solomeal -D solomeal_perf_m1 -e "SELECT 1" >/dev/null']
    cpus: 2.0
    mem_limit: 1g
  migrate:
    environment: &perf-environment
      SOLOMEAL_DATABASE_URL: mysql+pymysql://solomeal:${DB_PASSWORD}@db:3306/solomeal_perf_m1?charset=utf8mb4
      SOLOMEAL_AGENT_ENABLED: "false"
      SOLOMEAL_RECEIPT_VISION_ENABLED: "false"
      SOLOMEAL_RECEIPT_OCR_ENABLED: "false"
      SOLOMEAL_RECIPE_DISCOVERY_ENABLED: "false"
      SOLOMEAL_MODEL_API_KEY: ""
      SOLOMEAL_MODEL_NAME: ""
      SOLOMEAL_PERF_SANDBOX: "1"
  api:
    environment: *perf-environment
    ports:
      - "127.0.0.1:${PERF_API_PORT:-18101}:8000"
    cpus: 2.0
    mem_limit: 1g
  web:
    image: ${PERF_WEB_IMAGE:?Use the verified existing web image ID}
    pull_policy: never
  worker:
    profiles: [receipt-async]
  rabbitmq:
    profiles: [receipt-async]
  diagnostic:
    image: solomeal-api:${IMAGE_TAG}
    environment:
      <<: *perf-environment
      PYTHONPATH: /app:/perf
      PERF_OUTPUT: /perf-output/diagnostics.jsonl
    command: [python, -m, uvicorn, instrumented_app:create_instrumented_app, --factory, --host, 0.0.0.0, --port, "8000", --workers, "1"]
    volumes:
      - ${PERF_KIT_DIR}:/perf:ro
      - ${PERF_RESULT_DIR}:/perf-output
      - ${PERF_PRIVATE_DIR}:/perf-private
    cpus: 2.0
    mem_limit: 1g
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
  load:
    image: solomeal-perf-tools:${PERF_TOOL_TAG}
    environment:
      PERF_CREDENTIALS: /perf-private/credentials.json
    volumes:
      - ${PERF_KIT_DIR}:/perf:ro
      - ${PERF_RESULT_DIR}:/perf-output
      - ${PERF_PRIVATE_DIR}:/perf-private:ro
    working_dir: /perf
    cpus: 1.0
    mem_limit: 512m
    profiles: [tools]
