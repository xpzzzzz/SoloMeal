name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default token is already read-only at the repository level; declaring it here as well
# keeps the guarantee visible in the file and survives a change to that repository setting.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # AGENTS.md declares "Python 3.12+", so test the whole supported range
      # rather than only the floor. Stdlib-only, so this costs nothing to run.
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python3 test_unit.py

      - name: Integration smoke test
        run: python3 test_integration.py

      # AGENTS.md states that the live data/ under the repo root is never read
      # or written: both suites redirect the repositories at a temp directory.
      # Verified here rather than trusted, because the invariant is invisible
      # right up until it breaks, and the thing absorbing the damage locally
      # is a contributor's own data/.
      #
      # Two checks, because neither covers the other. data/ is gitignored, so
      # `git status` stays silent when a suite creates it, and a fresh checkout
      # has no data/ at all — its mere existence here is the failure. The
      # porcelain check then catches a suite writing anywhere else in the tree.
      - name: Suites left the checkout untouched
        run: |
          if [ -e data ]; then
            echo "a suite created data/ under the repo root:"
            ls -la data
            exit 1
          fi
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "a suite modified the working tree:"
            echo "$dirty"
            exit 1
          fi

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pinned exactly: an unpinned type checker turns an upstream release into
      # a surprise red build on an unrelated PR. Development/CI only — nothing
      # under src/ imports it.
      - name: Install mypy
        run: pip install mypy==2.3.0

      # The repo directory name contains a hyphen, which is not a valid Python
      # package name. Symlink it under a valid name so mypy can resolve the
      # relative imports the plugin uses throughout.
      - name: Type check
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          ln -sfn "$GITHUB_WORKSPACE" "$RUNNER_TEMP/shim/meal_manager"
          MYPYPATH="$RUNNER_TEMP/shim" mypy -p meal_manager

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install coverage==7.15.0

      # A ratchet, not a goal: raise --fail-under when coverage rises, never
      # lower it to make a build pass. Measured at 92%; one point of headroom
      # against rounding.
      - name: Measure coverage
        run: |
          coverage run --source=src,. --omit="test_*,*/__pycache__/*,*/backend/*" test_unit.py
          coverage run --append --source=src,. --omit="test_*,*/__pycache__/*,*/backend/*" test_integration.py
          coverage report --sort=cover --fail-under=91

  backend:
    runs-on: ubuntu-latest
    # Two full pytest runs (MySQL, then the SQLite fallback) plus the frontend
    # build the registration test needs. With F1-F8, the MySQL run alone took
    # 10m47s on CI, so both full suites need a larger job budget.
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: solomeal_test
          MYSQL_ROOT_PASSWORD: solomeal_ci_only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install independent backend dependencies
        run: pip install -r backend/requirements.lock
      # The registration test asserts a real diagnostic run freezes the built
      # frontend assets alongside the protocol, so it needs an actual build
      # output. Kept unconditional rather than skipping the assertion: a guard
      # that quietly stops firing is worse than a red job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend the registration test freezes
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Test on real isolated MySQL
        working-directory: backend
        env:
          SOLOMEAL_TEST_DATABASE_URL: mysql+pymysql://root:solomeal_ci_only@127.0.0.1:3306/solomeal_test?charset=utf8mb4
        run: python -m pytest
      - name: Check SQLite fallback
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Test network and session boundaries
        run: npm test --prefix frontend
      - name: Typecheck and build
        run: npm run build --prefix frontend

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLOMEAL_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked application dependencies
        run: |
          pip install -r backend/requirements.lock
          npm ci --prefix frontend
      - name: Install Chromium and Linux browser dependencies
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Run isolated scripted browser scenarios
        working-directory: frontend
        run: npm run e2e

  ci-complete:
    # One stable check name for the branch ruleset to require. Matrix legs come and go, so
    # requiring them individually would turn a dropped Python version into a required check
    # that never reports again — and an unsatisfiable required check blocks every merge.
    # This job depends on the ones that must pass and fails unless all of them succeeded.
    if: always()
    needs: [tests, types, coverage, backend, frontend, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A required job did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
